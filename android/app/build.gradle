plugins { id 'com.android.application' }
def parallelInstall = project.findProperty('parallelInstall') == 'true'
android {
 buildFeatures { buildConfig true }
 namespace 'org.alienclash.twod'
 compileSdk 36
 defaultConfig {
  applicationId 'com.ben10.myapp'
  minSdk 24
  targetSdk 36
  versionCode 143
  versionName '14.3'
  manifestPlaceholders = [appLabel: 'Ben 10 Omniverse']
 }
 signingConfigs {
  debug {
   storeFile rootProject.file('ci-signing/alien-clash-test.jks')
   storePassword 'android'
   keyAlias 'androiddebugkey'
   keyPassword 'android'
  }
 }
 sourceSets { main { assets.srcDirs = ['src/main/assets', '../../builds/web'] } }
 buildTypes { debug { signingConfig signingConfigs.debug; buildConfigField "boolean", "REWARDED_TEST_ADS", "true" }; release { minifyEnabled false; buildConfigField "boolean", "REWARDED_TEST_ADS", "false" } }
}














dependencies { implementation "com.google.android.gms:play-services-ads:25.5.0" }
