plugins { id 'com.android.application' }
def parallelInstall = project.findProperty('parallelInstall') == 'true'
android {
 namespace 'org.alienclash.twod'
 compileSdk 35
 defaultConfig {
  applicationId (parallelInstall ? 'org.alienclash.twod.online' : 'org.alienclash.twod')
  minSdk 23
  targetSdk 35
  versionCode 111
  versionName '11.1'
  manifestPlaceholders = [appLabel: (parallelInstall ? 'Ben 10 Alien Clash Online' : 'Ben 10 Alien Clash')]
 }
 signingConfigs {
  debug {
   storeFile rootProject.file('ci-signing/alien-clash-test.jks')
   storePassword 'android'
   keyAlias 'androiddebugkey'
   keyPassword 'android'
  }
 }
 sourceSets { main { assets.srcDirs = ['src/main/assets', '../../builds/web'] } }
 buildTypes { debug { signingConfig signingConfigs.debug }; release { minifyEnabled false } }
}








