name: Repair Play 13.3 standard release signature
on:
  push:
    branches: [main]
    paths: ['.github/workflows/play133-signature-repair.yml']
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare ephemeral encrypted key handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/signing133-private ci/signing-handoff
          chmod 700 /tmp/signing133-private
          openssl req -x509 -newkey rsa:3072 -nodes -keyout /tmp/signing133-private/recipient.key -out ci/signing-handoff/recipient.pem -days 1 -subj '/CN=Ephemeral Play 13.3 Signing Transport' 2>/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "signing-handoff-${GITHUB_RUN_ID}"
          git add ci/signing-handoff/recipient.pem
          git commit -m 'Publish ephemeral signing transport certificate [skip ci]'
          git push origin "HEAD:signing-handoff-${GITHUB_RUN_ID}"
          echo "HANDOFF_BRANCH=signing-handoff-${GITHUB_RUN_ID}"
          received=false
          for attempt in $(seq 1 120); do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/ci/signing-handoff/sealed.b64?ref=signing-handoff-${GITHUB_RUN_ID}" --jq .content > /tmp/signing133-private/response 2>/dev/null; then
              base64 -d /tmp/signing133-private/response > /tmp/signing133-private/sealed.b64
              base64 -d /tmp/signing133-private/sealed.b64 > /tmp/signing133-private/sealed.cms
              received=true
              break
            fi
            sleep 5
          done
          test "$received" = true
          openssl cms -decrypt -binary -inform DER -in /tmp/signing133-private/sealed.cms -recip ci/signing-handoff/recipient.pem -inkey /tmp/signing133-private/recipient.key -out /tmp/signing133-private/key.zip
          python3 - <<'PY'
          import zipfile,pathlib
          root=pathlib.Path('/tmp/signing133-private/key');root.mkdir(mode=0o700)
          z=zipfile.ZipFile('/tmp/signing133-private/key.zip')
          for n in ['ben10-upload.jks','store-password.txt','key-password.txt','upload-certificate.pem']:
           (root/n).write_bytes(z.read(n));(root/n).chmod(0o600)
          PY
          keytool -list -keystore /tmp/signing133-private/key/ben10-upload.jks -storepass:file /tmp/signing133-private/key/store-password.txt -alias ben10upload | grep '4A:4D:30:6C:45:D0:97:DB:5F:ED:F8:3B:A8:4A:DA:A0:41:75:E3:9E:27:7B:FE:1A:FF:49:2A:8E:8D:AD:F5:0F'
      - name: Standard jarsigner and apksigner release signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staged fixed-output
          gh release download play133-unsigned --dir staged
          python3 - <<'PY'
          import json,pathlib,hashlib
          r=json.loads(pathlib.Path('staged/signing-request.json').read_text())
          for ext in ['aab','apk']:
           f=pathlib.Path('staged/Ben10-Omniverse-13.3-unsigned.'+ext)
           assert hashlib.sha256(f.read_bytes()).hexdigest()==r[ext+'Sha256']
          PY
          sdkmanager 'build-tools;36.0.0'
          jarsigner -keystore /tmp/signing133-private/key/ben10-upload.jks -storepass:file /tmp/signing133-private/key/store-password.txt -keypass:file /tmp/signing133-private/key/key-password.txt -sigalg SHA256withRSA -digestalg SHA-256 -signedjar fixed-output/Ben10-Omniverse-13.3-signed.aab staged/Ben10-Omniverse-13.3-unsigned.aab ben10upload
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks /tmp/signing133-private/key/ben10-upload.jks --ks-key-alias ben10upload --ks-pass file:/tmp/signing133-private/key/store-password.txt --key-pass file:/tmp/signing133-private/key/key-password.txt --out fixed-output/Ben10-Omniverse-13.3-signed.apk staged/Ben10-Omniverse-13.3-unsigned.apk
          jarsigner -verify -verbose -certs fixed-output/Ben10-Omniverse-13.3-signed.aab > fixed-output/aab-signature.txt
          grep 'jar verified.' fixed-output/aab-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs fixed-output/Ben10-Omniverse-13.3-signed.apk > fixed-output/apk-signature.txt
          grep -i '4a4d306c45d097db5fedf83ba84adaa04175e39e277bfe1aff492a8e8dadf50f' fixed-output/apk-signature.txt
          curl -fLsS https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar validate --bundle=fixed-output/Ben10-Omniverse-13.3-signed.aab
          keytool -printcert -jarfile fixed-output/Ben10-Omniverse-13.3-signed.aab > fixed-output/aab-certificate.txt
          grep '4A:4D:30:6C:45:D0:97:DB:5F:ED:F8:3B:A8:4A:DA:A0:41:75:E3:9E:27:7B:FE:1A:FF:49:2A:8E:8D:AD:F5:0F' fixed-output/aab-certificate.txt
          python3 - <<'PY'
          import zipfile,hashlib,json,pathlib
          out=pathlib.Path('fixed-output');result={}
          for ext in ['aab','apk']:
           f=out/('Ben10-Omniverse-13.3-signed.'+ext)
           with zipfile.ZipFile(f) as z,zipfile.ZipFile('staged/Ben10-Omniverse-13.3-unsigned.'+ext) as original:
            for n in original.namelist():
             if not n.startswith('META-INF/'):assert original.read(n)==z.read(n),n
            if ext=='aab':
             sf=z.read('META-INF/BEN10UPL.SF');assert sf.count(b'Name: ')>100
           result[ext]={'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()}
          (out/'release-validation.json').write_text(json.dumps({'versionCode':133,'package':'com.ben10.myapp','signing':'standard jarsigner/apksigner','unchangedGamePayload':True,'files':result},indent=2));print(json.dumps(result))
          PY
          cp staged/rewards-tests.json staged/AndroidManifest.xml fixed-output/
          gh release create playstore-13.3-fixed fixed-output/* --prerelease --title 'Ben 10 Omniverse 13.3 - standard signed release' --notes 'Replaces the earlier 13.3 files rejected by Play Console. Re-signed using standard JDK jarsigner and Android apksigner, with the same original upload key. All non-signature package entries match the tested unsigned 13.3 build. Bundletool and signature checks passed. Play Console acceptance and physical-device ad checks still require verification.' --target "$GITHUB_SHA"
          gh release edit playstore-13.3 --notes 'SUPERSEDED: Play Console rejected the AAB signature. Do not upload these earlier files. Use the corrected standard-signed release at https://github.com/Kuladeepadthale/Ben10-2D-Alien-Clash/releases/tag/playstore-13.3-fixed'
      - name: Remove ephemeral signing material
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,shutil
          p=pathlib.Path('/tmp/signing133-private')
          if p.is_dir():shutil.rmtree(p)
          PY
