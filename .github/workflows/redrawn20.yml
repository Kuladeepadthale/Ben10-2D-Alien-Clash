name: Verify new 20-alien drawings
on:
  push:
    paths: ['web/redrawn20/**', 'web/redrawn20*.js', 'ci/check-redrawn20.cjs', '.github/workflows/redrawn20.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/redrawn-tools --no-save --no-package-lock @napi-rs/canvas
      - run: node ci/check-redrawn20.cjs web/redrawn20/*.js
        env:
          NODE_PATH: /tmp/redrawn-tools/node_modules
