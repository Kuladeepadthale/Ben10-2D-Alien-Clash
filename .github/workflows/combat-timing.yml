name: Combat timing checks
on:
  push:
    paths:
      - 'web/animation144.js'
      - 'web/index.html'
      - 'web/data.js'
      - 'web/cel-data.js'
      - 'ci/check-animation14*.cjs'
      - 'ci/animation-review/characters/**/revision.json'
      - '.github/workflows/combat-timing.yml'
  pull_request:
    paths:
      - 'web/animation144.js'
      - 'web/index.html'
      - 'web/data.js'
      - 'web/cel-data.js'
      - 'ci/check-animation14*.cjs'
      - 'ci/animation-review/characters/**/revision.json'
      - '.github/workflows/combat-timing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ci/check-animation144.cjs
      - run: node ci/check-animation145.cjs
      - run: node ci/check-animation146.cjs
      - run: node ci/check-animation147.cjs
      - run: node ci/check-animation148.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy scipy
      - run: python ci/build-cels.py --skip-bundle --through-id 23
      - run: node ci/check-animation149.cjs
