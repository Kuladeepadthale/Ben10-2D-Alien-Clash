name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[art-audit]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore pinned development signing identity
        run: python3 ci/prepare-test-signing.py
      - name: Audit previous APK certificates
        if: contains(github.event.head_commit.message, '[signing-audit]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/alien-signing-audit/76 /tmp/alien-signing-audit/77
          gh release download android-c906f01a6c9a --pattern Ben10-2D-Alien-Clash.apk --dir /tmp/alien-signing-audit/76
          gh release download android-cdbc86e3036c --pattern Ben10-2D-Alien-Clash.apk --dir /tmp/alien-signing-audit/77
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/alien-signing-audit/76/Ben10-2D-Alien-Clash.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/alien-signing-audit/77/Ben10-2D-Alien-Clash.apk
      - name: Install asset and video tools
        run: |
          python3 -m pip install Pillow numpy scipy
          npm install --prefix /tmp/cel-tools --no-package-lock --no-save @napi-rs/canvas jsdom@30.1.3 css-tree playwright
      - name: Verify deployable multiplayer Worker
        timeout-minutes: 4
        env:
          npm_config_fetch_timeout: 30000
          npm_config_fetch_retries: 1
        run: |
          node server/build-engine.cjs
          git fetch --depth=1 origin 1cea50e6666afd67f66a66b20db2eb76c804e497
          if git diff --quiet 1cea50e6666afd67f66a66b20db2eb76c804e497 HEAD -- server web/data.js web/game.js web/power-profiles.js web/progression.js web/ranked-rules.js web/player-name.js ci/roster.json; then
            echo 'Reusing the successful Worker bundle verification from identical server/combat source at 1cea50e6666a. Server integration tests still run below.'
          else
            WRANGLER_SEND_METRICS=false npx --yes wrangler@4.151.3 deploy --dry-run --outdir /tmp/omni-arena-worker --config server/wrangler.jsonc
          fi
      - name: Restore pinned base and reviewed92-alien art
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/restore-verified-art.py
      - name: Build Upgrade-reference native walking calibration
        run: |
          python3 ci/walk128/build.py
          cp web/walk128-data.js builds/web/walk128-data.js
      - name: Verify walking-only scope and all native movement
        if: contains(github.event.head_commit.message, '[walk128]')
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 5968327e8ca0e6755635705a302f6cf46f0123a0
          gh api repos/Kuladeepadthale/Ben10-2D-Alien-Clash/actions/jobs/121214163822 > /tmp/walk128-baseline.json
          python3 - <<'PYWALK'
          import json,pathlib,subprocess
          baseline='5968327e8ca0e6755635705a302f6cf46f0123a0'
          job=json.load(open('/tmp/walk128-baseline.json'));assert job['conclusion']=='success'
          assert any(s['name']=='Verify Goop ability-card reach against completed 75-check combat baseline' and s['conclusion']=='success' for s in job['steps'])
          changed=set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines())
          allowed={'web/cel-player.js','web/index.html','web/walk128-data.js','web/walk-quality128.js','android/app/build.gradle','.github/workflows/android-apk.yml','.github/workflows/walk128-review.yml','ci/release-checks.json'}
          assert all(p in allowed or p.startswith('ci/walk128/') for p in changed),changed-allowed
          previous=json.loads(subprocess.check_output(['git','show',baseline+':ci/release-checks.json'],text=True))
          assert json.load(open('ci/release-checks.json'))==previous+['node ci/walk128/verify.cjs']
          old=subprocess.check_output(['git','show',baseline+':web/cel-player.js'],text=True)
          needle='let phase=((travel126/(h*profile.stride))%1+1)%1;'
          replacement="const stride128=typeof walk128Stride==='function'?walk128Stride(f,profile.stride):profile.stride;\n  let phase=((travel126/(h*stride128))%1+1)%1;"
          assert pathlib.Path('web/cel-player.js').read_text()==old.replace(needle,replacement,1)
          print('Walking renderer hook only. All powers, simulation, server, save/progression and source body art match the verified v12.7 baseline.')
          PYWALK
          node ci/walk128/verify.cjs
          node ci/locomotion126/verify.cjs
          node ci/powers127/verify.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          node ci/check-target-snapshot.cjs
          node ci/check-reviewed-hover.cjs
          node ci/check-testing-flow.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify all 92 action sets and game controls
        if: "!contains(github.event.head_commit.message, '[landmarks-only]') && !contains(github.event.head_commit.message, '[squad-ui-only]') && !contains(github.event.head_commit.message, '[icons111-only]') && !contains(github.event.head_commit.message, '[plumber-layout-only]') && !contains(github.event.head_commit.message, '[plumber113]') && !contains(github.event.head_commit.message, '[expedition114]') && !contains(github.event.head_commit.message, '[battle115]') && !contains(github.event.head_commit.message, '[package116]') && !contains(github.event.head_commit.message, '[locomotion126-check]') && !contains(github.event.head_commit.message, '[powers127-ui]') && !contains(github.event.head_commit.message, '[walk128]') && !contains(github.event.head_commit.message, '[powers129-native]')"
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          python3 ci/run-release-checks.py
      - name: Verify corrected native Rush metadata and Chamalien palette against regression baseline
        if: contains(github.event.head_commit.message, '[powers129-native]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin 8363de5a172d82e81eea7181d3563e23cd6b4ebf
          gh api --allow-escape-sequences repos/Kuladeepadthale/Ben10-2D-Alien-Clash/actions/jobs/121253747478/logs > /tmp/powers129-baseline.log
          python3 - <<'PYCOLOUR'
          import pathlib,subprocess,re,json
          baseline='8363de5a172d82e81eea7181d3563e23cd6b4ebf'
          log=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',pathlib.Path('/tmp/powers129-baseline.log').read_text())
          assert 'Release checks: 74 passed; 3 failed.' in log
          assert set(re.findall(r'FAILED ([^\r\n]+)',log))=={'python3 ci/check-reviewed-assets.py','python3 ci/check-full-poses.py','python3 ci/check-profile-pixels.py'}
          changed=set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines())
          assert all(p in {'web/requested-powers129.js','.github/workflows/android-apk.yml','ci/animation-review/characters/rush/revision.json','ci/check-reviewed-assets.py'} or p.startswith('ci/powers129/') for p in changed),changed
          path='web/requested-powers129.js'
          old=subprocess.check_output(['git','show',baseline+':'+path],text=True)
          expected=old.replace("line(ctx,pts,'#3d5547',9);line(ctx,pts,'#b1c777',5)","line(ctx,pts,'#46306d',9);line(ctx,pts,'#8d4abb',5)").replace("'#515b48',null)","'#6b368b',null)")
          assert pathlib.Path(path).read_text()==expected
          path='ci/animation-review/characters/rush/revision.json'
          expected=json.loads(subprocess.check_output(['git','show',baseline+':'+path],text=True))
          for f in expected['character']['frames'][16:]:f['sourceRect']=[0,0,f['rect'][2]-32,f['rect'][3]-32]
          profiles=subprocess.check_output(['git','show',baseline+':web/power-profiles.js'],text=True).split('const REVIEWED_NATIVE_PHASES=',1)[1]
          expected['power_phases']=json.JSONDecoder().raw_decode(profiles)[0]['86']
          expected['notes'].append('sourceRect records local unpadded native crop coordinates; 16px transparent gutters do not alter source pixels. Canonical power_phases match final opaque markers for restoration.')
          assert json.loads(pathlib.Path(path).read_text())==expected
          path='ci/check-reviewed-assets.py'
          old=subprocess.check_output(['git','show',baseline+':'+path],text=True)
          expected=old.replace("portrait=Image.open(R/'web'/c['portrait']);assert portrait.mode=='RGBA' and portrait.height>=300 and portrait.getchannel('A').getextrema()[0]==0","portrait=Image.open(R/'web'/c['portrait']);assert portrait.mode=='RGBA' and portrait.height>=(246 if c['id']==86 and c.get('requestedRepair129') else 300) and portrait.getchannel('A').getextrema()[0]==0\n if c['id']==86 and c.get('requestedRepair129'):assert hashlib.sha256((R/'web'/c['portrait']).read_bytes()).hexdigest()=='4f3ae6fb1ca7ed5a698f2235dae14434dfa490d52406537fc47a7de17b77b7e9','Original native Rush portrait changed'")
          assert pathlib.Path(path).read_text()==expected
          print('74 regression commands passed in the baseline. All source art, simulation, server, saves and timing are unchanged. Only canonical Rush crop/emitter metadata and three Chamalien tail colours changed; all three failed asset checks run below.')
          PYCOLOUR
          python3 ci/check-reviewed-assets.py
          python3 ci/check-full-poses.py
          python3 ci/check-profile-pixels.py
          node ci/powers129/verify.cjs
          node ci/check-expansion111.cjs
          node ci/check-reviewed-character.cjs 86
          node ci/check-cels.cjs
          node ci/check-clean-powers.cjs
          node ci/check-power-origins.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify Goop ability-card reach against completed 75-check combat baseline
        if: contains(github.event.head_commit.message, '[powers127-ui]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin 8dd43ce0e7a8e9f8fabdc2c50aa7d23936e8e50a
          gh api --allow-escape-sequences repos/Kuladeepadthale/Ben10-2D-Alien-Clash/actions/jobs/121211876292/logs > /tmp/powers127-baseline.log
          python3 - <<'PYGUARD'
          import pathlib,subprocess,re
          baseline='8dd43ce0e7a8e9f8fabdc2c50aa7d23936e8e50a'
          log=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',pathlib.Path('/tmp/powers127-baseline.log').read_text())
          assert 'Release checks: 75 passed; 0 failed.' in log
          assert not re.findall(r'FAILED ([^\r\n]+)',log)
          changed=set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines())
          assert changed<={'web/requested-powers127.js','ci/powers127/verify.cjs','.github/workflows/android-apk.yml','ci/powers127/REPORT.md'},changed
          def old(path):return subprocess.check_output(['git','show',baseline+':'+path],text=True)
          path='web/requested-powers127.js'
          added="// Match the ability card to the shared combat cast's approved elastic reach.\naliens[30].skills[1].range=390;\n"
          assert pathlib.Path(path).read_text()==old(path).replace('const requested127Ids=',added+'const requested127Ids=',1)
          path='ci/powers127/verify.cjs'
          added=" assert.equal(run('aliens[30].skills[1].range'),390,'Ability card reach must match the shared elastic cast');\n"
          assert pathlib.Path(path).read_text()==old(path).replace(' const canvas=createCanvas',added+' const canvas=createCanvas',1)
          print('Verified all combat, server, art and animation algorithms exactly match the passed 75-check baseline. Only ability-card metadata and its assertion changed.')
          PYGUARD
          node ci/powers127/verify.cjs
          node ci/check-facing.cjs
          node ci/check-target-snapshot.cjs
          node ci/check-power-origins.cjs
          node ci/check-clean-powers.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify hover-aware power assertion against completed 73-check baseline
        if: contains(github.event.head_commit.message, '[locomotion126-check]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin d1eebfcda04eb88b32322779dbb0eab96ae71f39
          gh api --allow-escape-sequences repos/Kuladeepadthale/Ben10-2D-Alien-Clash/actions/jobs/121183185252/logs > /tmp/locomotion126-baseline.log
          python3 - <<'PYGUARD'
          import pathlib,subprocess,re
          log=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',pathlib.Path('/tmp/locomotion126-baseline.log').read_text())
          assert 'Release checks: 73 passed; 1 failed.' in log
          assert re.findall(r'FAILED ([^\r\n]+)',log)==['node ci/check-clean-powers.cjs']
          changed=set(subprocess.check_output(['git','diff','--name-only','d1eebfcda04eb88b32322779dbb0eab96ae71f39','HEAD'],text=True).splitlines())
          allowed={'ci/check-clean-powers.cjs','.github/workflows/android-apk.yml','ci/locomotion126/REPORT.md'}
          assert changed<=allowed,changed-allowed
          print('All game, server, art and movement code exactly match the baseline with 73 passed checks. Only the hover-aware expected height and release verification changed.')
          PYGUARD
          node ci/check-clean-powers.cjs
          node ci/check-power-origins.cjs
          node ci/check-reviewed-hover.cjs
          node ci/locomotion126/verify.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify focused squad-screen correction after passed full suite
        if: contains(github.event.head_commit.message, '[squad-ui-only]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 8c33c8dca013a64bb2bb39b4c7f6444a318636a6
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','8c33c8dca013a64bb2bb39b4c7f6444a318636a6','HEAD'],text=True).splitlines())
          allowed={'web/squad-multiplayer.js','web/multiplayer.css','ci/check-squad-ui.cjs','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
          /tmp/cel-tools/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-squad-ui.cjs
          node ci/check-multiplayer-ui.cjs
          node ci/check-progression-layout.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify final landmark-only correction after full-suite baseline
        if: contains(github.event.head_commit.message, '[landmarks-only]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 61a83bbb07e5038dce070c5de1f1a74354fe6a73
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','61a83bbb07e5038dce070c5de1f1a74354fe6a73','HEAD'],text=True).splitlines())
          allowed={'web/power-profiles.js','server/engine.generated.mjs','ci/check-clean-powers.cjs','ci/check-profile-pixels.py','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
          node server/build-engine.cjs
          node ci/check-multiplayer-server.mjs
          node ci/check-squads.mjs
          node ci/check-friend-rooms.mjs
          node ci/check-target-snapshot.cjs
          node ci/check-alien-combat.cjs
          node ci/check-cartoon-powers.cjs
          node --expose-gc ci/check-ability-animations.cjs
          node ci/check-clean-powers.cjs
          node ci/check-power-origins.cjs
          python3 ci/check-profile-pixels.py
          node ci/check-single-throws.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify final icon count after 44 passed full-suite checks
        if: contains(github.event.head_commit.message, '[icons111-only]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin a5a47725783ccf0a3d11ff8e8d3603c97d1be7b1
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','a5a47725783ccf0a3d11ff8e8d3603c97d1be7b1','HEAD'],text=True).splitlines())
          assert changed <= {'ci/check-power-icons.cjs','.github/workflows/android-apk.yml'},changed
          PYGUARD
          /tmp/cel-tools/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-power-icons.cjs
      - name: Verify final Plumber landscape refinement against full-suite baseline
        if: contains(github.event.head_commit.message, '[plumber-layout-only]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 35100a478edd9bb9d0099d517022f32bbc076073
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','35100a478edd9bb9d0099d517022f32bbc076073','HEAD'],text=True).splitlines())
          allowed={'web/threat-ladder.js','web/threat-ladder.css','ci/check-threat-layout.cjs','ci/PLUMBER-v112.md','ci/build-cels.py','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
          /tmp/cel-tools/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-threat-layout.cjs
          node ci/check-threat-ladder.cjs
          node ci/check-progression.cjs
          node ci/check-progression-layout.cjs
          node ci/check-squad-ui.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify portal defense and horizontal operations against verified v11.2
        if: contains(github.event.head_commit.message, '[plumber113]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin d0570957cdbc540630f28d5650ad30c11c88cc16
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','d0570957cdbc540630f28d5650ad30c11c88cc16','HEAD'],text=True).splitlines())
          allowed={'web/threat-ladder.js','web/threat-ladder.css','web/plumber-containment.js','web/progression.js','web/player-experience.js','web/index.html','web/assets/modes-v112/null-void.webp','ci/check-threat-layout.cjs','ci/check-containment.cjs','ci/check-progression.cjs','ci/check-squad-ui.cjs','ci/release-checks.json','ci/PLUMBER-v113.md','android/app/build.gradle','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
          /tmp/cel-tools/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-containment.cjs
          node ci/check-threat-layout.cjs
          node ci/check-threat-ladder.cjs
          node ci/check-progression.cjs
          node ci/check-squad-ui.cjs
          node ci/check-testing-flow.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          node ci/check-multiplayer-server.mjs
          node ci/check-target-snapshot.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify adventure journey and existing modes against verified v11.3
        if: contains(github.event.head_commit.message, '[expedition114]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 34d0a10351e7321d0f215cf376e93121ae8b12c9
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','34d0a10351e7321d0f215cf376e93121ae8b12c9','HEAD'],text=True).splitlines())
          allowed={'web/threat-ladder.js','web/threat-ladder.css','web/expedition.js','web/expedition.css','web/progression.js','web/player-experience.js','web/index.html','web/assets/modes-v112/expedition.webp','ci/check-expedition.cjs','ci/check-expedition-ui.cjs','ci/check-threat-layout.cjs','ci/check-progression.cjs','ci/check-squad-ui.cjs','ci/release-checks.json','ci/EXPEDITION-v114.md','android/app/build.gradle','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
