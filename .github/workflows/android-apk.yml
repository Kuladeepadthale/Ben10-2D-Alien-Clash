name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: alien-clash-test-key-v1
      - name: Check game scripts and assets
        run: |
          for script in web/*.js; do node --check "$script"; done
          python3 - <<'PY'
          from pathlib import Path
          root=Path('web/assets/classic')
          dirs=[p for p in root.iterdir() if p.is_dir()]
          assert len(dirs)==10
          for d in dirs:
            for state in ['portrait','idle','walk','normal','power','ultimate','guard','jump','hit']:
              p=d/(state+'.webp')
              assert p.stat().st_size>100, str(p)
          PY
      - name: Build APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Verify APK
        run: |
          mkdir -p builds
          cp android/app/build/outputs/apk/debug/app-debug.apk builds/Ben10-2D-Alien-Clash.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose builds/Ben10-2D-Alien-Clash.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builds/Ben10-2D-Alien-Clash.apk
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('builds/Ben10-2D-Alien-Clash.apk')
          assert 'assets/index.html' in z.namelist()
          assert len([p for p in z.namelist() if p.startswith('assets/assets/classic/') and p.endswith('.webp')])==90
          PY
          sha256sum builds/Ben10-2D-Alien-Clash.apk > builds/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AlienClash2D-Android-APK
          path: builds/*
      - name: Publish installable test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_SHA::12}" builds/Ben10-2D-Alien-Clash.apk builds/SHA256SUMS.txt --title 'Ben 10 Classic Alien Clash — Android 0.7' --notes 'Hierarchical joint skeletons for all ten aliens: head, spine, waist, shoulders, elbows, wrists, hips, knees and ankles with continuous skin weights. Four Arms has four arm chains; Stinkfly has wings; Ghostfreak has a tail. Existing home hub and modes retained. New image-based motion; not extracted TV animation. Debug-signed testing APK. Android 6.0+ with current System WebView. Original Godot source preserved. Existing builds signed with a different key must be uninstalled first.' --prerelease --target "$GITHUB_SHA"
