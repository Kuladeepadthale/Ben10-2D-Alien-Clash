name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: alien-clash-test-key-v1
      - name: Bake all alien transitions at source resolution
        run: |
          python3 -m pip install Pillow numpy opencv-python-headless
          python3 ci/heatblast-smooth/build.py
          python3 ci/heatblast-smooth/build-all.py
      - name: Check game scripts and assets
        run: |
          python3 ci/check-drawn-assets.py
          node ci/check-locomotion.cjs
          node ci/check-footwork-dash.cjs
          node ci/check-cartoon-gaits.cjs
          npm install --prefix /tmp/diamondhead-canvas --no-package-lock --no-save @napi-rs/canvas
          NODE_PATH=/tmp/diamondhead-canvas/node_modules node ci/check-diamondhead-poses.cjs
          NODE_PATH=/tmp/diamondhead-canvas/node_modules node ci/check-heatblast-smooth.cjs
          npm install --prefix /tmp/omni-ui-qa --no-package-lock --no-save jsdom@30.1.3 css-tree
          NODE_PATH=/tmp/omni-ui-qa/node_modules node ci/check-interface.cjs
          for script in web/*.js; do node --check "$script"; done
          python3 - <<'PY'
          from pathlib import Path
          import struct, json
          manifest=json.loads(Path('web/assets/drawn-aliens/manifest.json').read_text())
          assert set(manifest['characters'])==set(map(str,range(1,10)))
          for alien in manifest['characters'].values():
            raw=Path('web/'+alien['src']).read_bytes()
            assert struct.unpack('>II',raw[16:24])==(alien['width'],alien['height'])
            assert len(alien['frames'])==48
            for x,y,w,h,ox,oy in alien['frames']:
              assert x>=0 and y>=0 and x+w<=alien['width'] and y+h<=alien['height'] and oy==h
          puppet=Path('web/assets/diamondhead-puppet/walk-parts-v1.png').read_bytes()
          assert puppet[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',puppet[16:24])==(1254,1254)
          data=Path('web/assets/heatblast-poses/atlas-v8.png').read_bytes()
          assert data[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',data[16:24])==(1086,1448)
          root=Path('web/assets/classic')
          dirs=[p for p in root.iterdir() if p.is_dir()]
          assert len(dirs)==10
          for d in dirs:
            for state in ['portrait','idle','walk','normal','power','ultimate','guard','jump','hit']:
              p=d/(state+'.webp')
              assert p.stat().st_size>100, str(p)
          PY
      - name: Install video encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - name: Render current footwork and dash preview
        run: NODE_PATH=/tmp/diamondhead-canvas/node_modules node ci/render-footwork-video.cjs
      - name: Build APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Verify APK
        run: |
          mkdir -p builds
          cp android/app/build/outputs/apk/debug/app-debug.apk builds/Ben10-2D-Alien-Clash.apk
          cp previews/Alien-Clash-Classic-Walks-Dash.mp4 builds/Alien-Clash-Classic-Walks-Dash.mp4
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose builds/Ben10-2D-Alien-Clash.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builds/Ben10-2D-Alien-Clash.apk
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('builds/Ben10-2D-Alien-Clash.apk')
          assert 'assets/index.html' in z.namelist()
          assert 'assets/heatblast-poses.js' in z.namelist()
          assert 'assets/heatblast-smooth-data.js' in z.namelist()
          assert all('assets/assets/heatblast-smooth/atlas-v21-'+str(i)+'.webp' in z.namelist() for i in range(8))
          assert 'assets/cartoon-gaits.js' in z.namelist()
          assert 'assets/clarity.js' in z.namelist()
          assert 'assets/alien-smooth.js' in z.namelist()
          assert 'assets/alien-smooth-data.js' in z.namelist()
          assert len([p for p in z.namelist() if p.startswith('assets/assets/alien-smooth/') and p.endswith('.webp')])>=9
          assert 'assets/alien-poses.js' in z.namelist()
          assert 'assets/diamondhead-puppet.js' in z.namelist()
          assert 'assets/diamondhead-gait-data.js' in z.namelist()
          assert 'assets/assets/diamondhead-puppet/walk-parts-v1.png' in z.namelist()
          assert 'assets/alien-poses-data.js' in z.namelist()
          assert len([p for p in z.namelist() if p.startswith('assets/assets/drawn-aliens/') and p.endswith('.png')])==9
          assert 'assets/assets/heatblast-poses/atlas-v8.png' in z.namelist()
          assert len([p for p in z.namelist() if p.startswith('assets/assets/classic/') and p.endswith('.webp')])==90
          PY
          sha256sum builds/Ben10-2D-Alien-Clash.apk builds/Alien-Clash-Classic-Walks-Dash.mp4 > builds/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AlienClash2D-Android-APK
          path: builds/*
      - name: Publish installable test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_SHA::12}" builds/Ben10-2D-Alien-Clash.apk builds/Alien-Clash-Classic-Walks-Dash.mp4 builds/SHA256SUMS.txt --title 'Ben 10 Classic Alien Clash — Android 2.5 — Restored classic walks and alien-specific movement' --notes 'Restores the previous full-body illustrated walking animation and removes the procedural leg renderer. Gives all ten aliens separate movement profiles: alternating skate pushes and glides for XLR8, heavy Four Arms strides, measured Diamondhead steps, quadruped Wildmutt bounding, quick Grey Matter steps, fluid Upgrade strides, Stinkfly hovering, Ripjaws stalking, and Ghostfreak floating. Keeps the forward dodge dash, existing attacks, and source-resolution clarity improvements. Debug-signed Android test APK.' --prerelease --target "$GITHUB_SHA"

