name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[art-audit]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore pinned development signing identity
        run: python3 ci/prepare-test-signing.py
      - name: Audit previous APK certificates
        if: contains(github.event.head_commit.message, '[signing-audit]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/alien-signing-audit/76 /tmp/alien-signing-audit/77
          gh release download android-c906f01a6c9a --pattern Ben10-2D-Alien-Clash.apk --dir /tmp/alien-signing-audit/76
          gh release download android-cdbc86e3036c --pattern Ben10-2D-Alien-Clash.apk --dir /tmp/alien-signing-audit/77
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/alien-signing-audit/76/Ben10-2D-Alien-Clash.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/alien-signing-audit/77/Ben10-2D-Alien-Clash.apk
      - name: Install asset and video tools
        run: |
          python3 -m pip install Pillow numpy scipy
          npm install --prefix /tmp/cel-tools --no-package-lock --no-save @napi-rs/canvas jsdom@30.1.3 css-tree playwright
      - name: Verify deployable multiplayer Worker
        timeout-minutes: 4
        env:
          npm_config_fetch_timeout: 30000
          npm_config_fetch_retries: 1
        run: |
          node server/build-engine.cjs
          git fetch --depth=1 origin 1cea50e6666afd67f66a66b20db2eb76c804e497
          if git diff --quiet 1cea50e6666afd67f66a66b20db2eb76c804e497 HEAD -- server web/data.js web/game.js web/power-profiles.js web/progression.js web/ranked-rules.js web/player-name.js ci/roster.json; then
            echo 'Reusing the successful Worker bundle verification from identical server/combat source at 1cea50e6666a. Server integration tests still run below.'
          else
            WRANGLER_SEND_METRICS=false npx --yes wrangler@4.151.3 deploy --dry-run --outdir /tmp/omni-arena-worker --config server/wrangler.jsonc
          fi
      - name: Restore pinned base and reviewed92-alien art
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/restore-verified-art.py
      - name: Verify all 92 action sets and game controls
        if: "!contains(github.event.head_commit.message, '[landmarks-only]') && !contains(github.event.head_commit.message, '[squad-ui-only]') && !contains(github.event.head_commit.message, '[icons111-only]') && !contains(github.event.head_commit.message, '[plumber-layout-only]') && !contains(github.event.head_commit.message, '[plumber113]') && !contains(github.event.head_commit.message, '[expedition114]') && !contains(github.event.head_commit.message, '[battle115]') && !contains(github.event.head_commit.message, '[package116]') && !contains(github.event.head_commit.message, '[locomotion126-check]')"
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          python3 ci/run-release-checks.py
      - name: Verify hover-aware power assertion against completed 73-check baseline
        if: contains(github.event.head_commit.message, '[locomotion126-check]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin d1eebfcda04eb88b32322779dbb0eab96ae71f39
          gh api repos/Kuladeepadthale/Ben10-2D-Alien-Clash/actions/jobs/121183185252/logs > /tmp/locomotion126-baseline.log
          python3 - <<'PYGUARD'
          import pathlib,subprocess,re
          log=pathlib.Path('/tmp/locomotion126-baseline.log').read_text()
          assert 'Release checks: 73 passed; 1 failed.' in log
          assert re.findall(r'FAILED ([^\r\n]+)',log)==['node ci/check-clean-powers.cjs']
          changed=set(subprocess.check_output(['git','diff','--name-only','d1eebfcda04eb88b32322779dbb0eab96ae71f39','HEAD'],text=True).splitlines())
          allowed={'ci/check-clean-powers.cjs','.github/workflows/android-apk.yml','ci/locomotion126/REPORT.md'}
          assert changed<=allowed,changed-allowed
          print('All game, server, art and movement code exactly match the baseline with 73 passed checks. Only the hover-aware expected height and release verification changed.')
          PYGUARD
          node ci/check-clean-powers.cjs
          node ci/check-power-origins.cjs
          node ci/check-reviewed-hover.cjs
          node ci/locomotion126/verify.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify focused squad-screen correction after passed full suite
        if: contains(github.event.head_commit.message, '[squad-ui-only]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 8c33c8dca013a64bb2bb39b4c7f6444a318636a6
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','8c33c8dca013a64bb2bb39b4c7f6444a318636a6','HEAD'],text=True).splitlines())
          allowed={'web/squad-multiplayer.js','web/multiplayer.css','ci/check-squad-ui.cjs','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
          /tmp/cel-tools/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-squad-ui.cjs
          node ci/check-multiplayer-ui.cjs
          node ci/check-progression-layout.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify final landmark-only correction after full-suite baseline
        if: contains(github.event.head_commit.message, '[landmarks-only]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 61a83bbb07e5038dce070c5de1f1a74354fe6a73
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','61a83bbb07e5038dce070c5de1f1a74354fe6a73','HEAD'],text=True).splitlines())
          allowed={'web/power-profiles.js','server/engine.generated.mjs','ci/check-clean-powers.cjs','ci/check-profile-pixels.py','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
          node server/build-engine.cjs
          node ci/check-multiplayer-server.mjs
          node ci/check-squads.mjs
          node ci/check-friend-rooms.mjs
          node ci/check-target-snapshot.cjs
          node ci/check-alien-combat.cjs
          node ci/check-cartoon-powers.cjs
          node --expose-gc ci/check-ability-animations.cjs
          node ci/check-clean-powers.cjs
          node ci/check-power-origins.cjs
          python3 ci/check-profile-pixels.py
          node ci/check-single-throws.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify final icon count after 44 passed full-suite checks
        if: contains(github.event.head_commit.message, '[icons111-only]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin a5a47725783ccf0a3d11ff8e8d3603c97d1be7b1
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','a5a47725783ccf0a3d11ff8e8d3603c97d1be7b1','HEAD'],text=True).splitlines())
          assert changed <= {'ci/check-power-icons.cjs','.github/workflows/android-apk.yml'},changed
          PYGUARD
          /tmp/cel-tools/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-power-icons.cjs
      - name: Verify final Plumber landscape refinement against full-suite baseline
        if: contains(github.event.head_commit.message, '[plumber-layout-only]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 35100a478edd9bb9d0099d517022f32bbc076073
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','35100a478edd9bb9d0099d517022f32bbc076073','HEAD'],text=True).splitlines())
          allowed={'web/threat-ladder.js','web/threat-ladder.css','ci/check-threat-layout.cjs','ci/PLUMBER-v112.md','ci/build-cels.py','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
          /tmp/cel-tools/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-threat-layout.cjs
          node ci/check-threat-ladder.cjs
          node ci/check-progression.cjs
          node ci/check-progression-layout.cjs
          node ci/check-squad-ui.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify portal defense and horizontal operations against verified v11.2
        if: contains(github.event.head_commit.message, '[plumber113]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin d0570957cdbc540630f28d5650ad30c11c88cc16
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','d0570957cdbc540630f28d5650ad30c11c88cc16','HEAD'],text=True).splitlines())
          allowed={'web/threat-ladder.js','web/threat-ladder.css','web/plumber-containment.js','web/progression.js','web/player-experience.js','web/index.html','web/assets/modes-v112/null-void.webp','ci/check-threat-layout.cjs','ci/check-containment.cjs','ci/check-progression.cjs','ci/check-squad-ui.cjs','ci/release-checks.json','ci/PLUMBER-v113.md','android/app/build.gradle','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
          /tmp/cel-tools/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-containment.cjs
          node ci/check-threat-layout.cjs
          node ci/check-threat-ladder.cjs
          node ci/check-progression.cjs
          node ci/check-squad-ui.cjs
          node ci/check-testing-flow.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          node ci/check-multiplayer-server.mjs
          node ci/check-target-snapshot.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify adventure journey and existing modes against verified v11.3
        if: contains(github.event.head_commit.message, '[expedition114]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 34d0a10351e7321d0f215cf376e93121ae8b12c9
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','34d0a10351e7321d0f215cf376e93121ae8b12c9','HEAD'],text=True).splitlines())
          allowed={'web/threat-ladder.js','web/threat-ladder.css','web/expedition.js','web/expedition.css','web/progression.js','web/player-experience.js','web/index.html','web/assets/modes-v112/expedition.webp','ci/check-expedition.cjs','ci/check-expedition-ui.cjs','ci/check-threat-layout.cjs','ci/check-progression.cjs','ci/check-squad-ui.cjs','ci/release-checks.json','ci/EXPEDITION-v114.md','android/app/build.gradle','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
          /tmp/cel-tools/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-expedition.cjs
          node ci/check-expedition-ui.cjs
          node ci/check-threat-layout.cjs
          node ci/check-containment.cjs
          node ci/check-threat-ladder.cjs
          node ci/check-progression.cjs
          node ci/check-squad-ui.cjs
          node ci/check-testing-flow.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          node ci/check-multiplayer-server.mjs
          node ci/check-target-snapshot.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify battle cards and XP against verified v11.4
        if: contains(github.event.head_commit.message, '[battle115]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 3939737eeba12aa57c534fd37b9d7d9cbecc2504
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','3939737eeba12aa57c534fd37b9d7d9cbecc2504','HEAD'],text=True).splitlines())
          allowed={'web/battle-polish.js','web/battle-polish.css','web/index.html','web/assets/modes-v112/multiplayer.webp','web/assets/modes-v112/survival.webp','web/assets/modes-v112/testing.webp','ci/check-battle-polish.cjs','ci/BATTLE-v115.md','android/app/build.gradle','.github/workflows/android-apk.yml'}
          assert changed<=allowed,changed-allowed
          PYGUARD
          /tmp/cel-tools/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-battle-polish.cjs
          node ci/check-expedition.cjs
          node ci/check-expedition-ui.cjs
          node ci/check-threat-layout.cjs
          node ci/check-containment.cjs
          node ci/check-threat-ladder.cjs
          node ci/check-progression.cjs
          node ci/check-squad-ui.cjs
          node ci/check-testing-flow.cjs
          node ci/check-facing.cjs
          node ci/check-footwork-dash.cjs
          node ci/check-multiplayer-server.mjs
          node ci/check-target-snapshot.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Verify packaging-only repair after 51 passed checks
        if: contains(github.event.head_commit.message, '[package116]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin 6f6fa28d5d39746d15911a90e4d4869dac46282f
          gh api repos/Kuladeepadthale/Ben10-2D-Alien-Clash/actions/jobs/120300208852 > /tmp/verified-game-checks.json
          python3 - <<'PY'
          import json,subprocess,pathlib
          job=json.load(open('/tmp/verified-game-checks.json'))
          assert any(s['name']=='Verify all 92 action sets and game controls' and s['conclusion']=='success' for s in job['steps'])
          changed=set(subprocess.check_output(['git','diff','--name-only','6f6fa28d5d39746d15911a90e4d4869dac46282f','HEAD'],text=True).splitlines())
          assert changed <= {'android/app/build.gradle','.github/workflows/android-apk.yml'},changed
          build=pathlib.Path('android/app/build.gradle').read_text()
          assert "plugins { id 'com.android.application' }" in build
          assert 'versionCode 116' in build and "versionName '11.6'" in build
          print('All game, server and art files exactly match the build with 51 passed checks; verified Android packaging repair.')
          PY
      - name: Deploy online Worker when owner credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            WRANGLER_SEND_METRICS=false npx --yes wrangler@4.151.3 deploy --config server/wrangler.jsonc
          else
            echo "::notice::Online Worker deployment needs owner Cloudflare credentials. APK and server code are built and verified."
          fi
      - name: Build standard and separate-install APKs
        run: |
          gradle -p android --no-daemon assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk builds/Ben10-2D-Alien-Clash.apk
          gradle -p android --no-daemon -PparallelInstall=true assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk builds/Ben10-Alien-Clash-Online.apk
      - name: Verify APK and downloads
        run: |
          python3 ci/check-apk-signing.py
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose builds/Ben10-2D-Alien-Clash.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builds/Ben10-2D-Alien-Clash.apk
          python3 - <<'PY'
          import zipfile,json
          z=zipfile.ZipFile('builds/Ben10-2D-Alien-Clash.apk');names=z.namelist()
          assert 'assets/threat-ladder.js' in names and 'assets/villain-data.js' in names
          villains=json.loads(z.read('assets/assets/villains/manifest.json'))
          assert len(villains['characters'])==50
          assert all('assets/'+v['src'] in names and 'assets/'+v['portrait'] in names for v in villains['characters'])
          assert 'assets/battle-polish.js' in names and 'assets/battle-polish.css' in names
          assert 'assets/index.html' in names and 'assets/cel-player.js' in names
          assert all('assets/'+f in names for f in ['account-boot.js','account-config.js','account-cloud.js','account.js','account.css','ranked-rules.js','multiplayer-config.js','multiplayer.js','multiplayer.css','squad-multiplayer.js','player-name.js','player-experience.js','player-experience.css'])
          assert b'wss://omnitrix-ranked-arena.kuladeepadthale.workers.dev/arena' in z.read('assets/multiplayer-config.js')
          assert all('assets/assets/ui/abilities/ability-atlas-'+str(i).zfill(2)+'-v83.png' in names for i in range(8))
          assert all('assets/assets/ui/abilities/ability-atlas-'+str(i).zfill(2)+'-v90.webp' in names for i in range(8,13))
          assert 'assets/progression.js' in names and 'assets/progression.css' in names
          assert 'assets/expansion-effects.js' in names
          assert 'assets/cartoon-power-effects.js' in names
          assert 'assets/ability-animations.js' in names
          assert 'assets/combat-choreography.js' in names
          assert all('assets/assets/ui/abilities/ability-atlas-'+str(i).zfill(2)+'-v100.webp' in names for i in range(13,18))
          m=json.loads(z.read('assets/assets/cels/manifest.json'))
          assert len(m['characters'])==92
          reviewed=m['characters'][35];assert reviewed.get('reviewedRevision')==1
          assert all('assets/'+sheet['src'] in names for sheet in reviewed['sheets'])
          assert 'assets/'+reviewed['portrait'] in names
          assert all('assets/assets/ui/abilities/ability-atlas-'+str(i).zfill(2)+'-v111.webp' in names for i in range(18,23))
          icons=json.loads(z.read('assets/assets/ui/abilities/manifest.json'));assert len(icons['entries'])==460
          assert all('assets/assets/modes-v112/'+p+'.webp' in names for p in ['classic','galactic','boss-rush','null-void','expedition','multiplayer','survival','testing'])
          assert b'Plumber Missions' in z.read('assets/threat-ladder.js') and 'assets/plumber-containment.js' in names and 'assets/expedition.js' in names and 'assets/expedition.css' in names
          for c in m['characters']:
           assert all('assets/'+s['src'] in names for s in c['sheets'])
           assert set(c['clips'])=={'idle','walk','jump','normal','skill0','skill1','skill2','ultimate','guard','hit','ko','dash'}
          assert not any('alien-smooth' in n or 'heatblast-smooth' in n or 'footwork.js' in n for n in names)
          PY
          sha256sum builds/*.apk > builds/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: AlienClash2D-Android-APK
          path: |
            builds/*.apk
            builds/SHA256SUMS.txt
      - name: Publish final APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_SHA::12}" builds/*.apk builds/SHA256SUMS.txt --title 'Ben 10 Alien Clash 12.5 — Mechanic, Shell and Reptile Animation Repairs' --notes 'Repairs Jury Rigg Gear Trap and Junkyard Arsenal, Four Arms walking, Cannonbolt walking/Shell Slam/Rebound Rush/Orbit Breaker, and Arctiguana walking/Glacial Slam/Absolute Zero. Preserves all four original standing designs, manual facing and captured targets. Includes visible trap deployment/arming, muzzle-launched scrap rockets, native shell curl/impact/recovery and low reptile breath poses. See ci/animation-review/requests125/REPORT.md for validation and saved source/prompt records. Live Worker deployment still requires owner Cloudflare credentials.' --prerelease --target "$GITHUB_SHA"




# v8.2: verify full-screen controls and all forty native replacement sheets.









