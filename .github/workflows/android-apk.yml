name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: alien-clash-test-key-v1
      - name: Install asset and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install Pillow numpy scipy
          npm install --prefix /tmp/cel-tools --no-package-lock --no-save @napi-rs/canvas jsdom@30.1.3 css-tree
      - name: Export native cel assets and Android bundle
        run: python3 ci/build-cels.py
      - name: Verify all ten action sets and game controls
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          node ci/check-cels.cjs
          node ci/check-footwork-dash.cjs
          node ci/check-interface.cjs
          node ci/check-cel-ui.cjs
          for script in web/*.js; do node --check "$script"; done
      - name: Render all alien action clips
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          node ci/render-cels.cjs
          python3 ci/verify-cel-video.py
      - name: Build APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Verify APK and downloads
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk builds/Ben10-2D-Alien-Clash.apk
          cp previews/All-Aliens-Cel-Actions.mp4 previews/All-Aliens-Cel-Preview.zip builds/
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose builds/Ben10-2D-Alien-Clash.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builds/Ben10-2D-Alien-Clash.apk
          python3 - <<'PY'
          import zipfile,json
          z=zipfile.ZipFile('builds/Ben10-2D-Alien-Clash.apk');names=z.namelist()
          assert 'assets/index.html' in names and 'assets/cel-player.js' in names
          m=json.loads(z.read('assets/assets/cels/manifest.json'))
          assert len(m['characters'])==10
          for c in m['characters']:
           assert all('assets/'+s['src'] in names for s in c['sheets'])
           assert set(c['clips'])=={'idle','walk','jump','normal','skill0','skill1','skill2','ultimate','guard','hit','ko','dash'}
          assert not any('alien-smooth' in n or 'heatblast-smooth' in n or 'footwork.js' in n for n in names)
          PY
          sha256sum builds/*.apk builds/*.mp4 builds/*.zip > builds/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AlienClash2D-Android-APK
          path: |
            builds/*.apk
            builds/*.mp4
            builds/*.zip
            builds/SHA256SUMS.txt
      - name: Publish APK and complete preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_SHA::12}" builds/*.apk builds/*.mp4 builds/*.zip builds/SHA256SUMS.txt --title 'Ben 10 Alien Clash 3.0 — All-alien cel action clips' --notes 'New native-resolution whole-body cel art for all ten aliens and every action: individual walking, skating, flight and hovering cycles; jump; normal strike; three powers; ultimate; guard; hit; knockdown; dash. Discrete clips replace all optical-flow and crossfade animation. Walking cadence follows distance traveled. Current-pair texture loading reduces memory. Existing combat, upgrades and dodge dash retained. Includes a complete 1080p preview. Debug-signed test APK.' --prerelease --target "$GITHUB_SHA"
