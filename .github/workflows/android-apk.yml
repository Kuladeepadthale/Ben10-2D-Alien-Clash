      - name: Verify battle cards and XP against verified v11.4
        if: contains(github.event.head_commit.message, '[battle115]')
        env:
          NODE_PATH: /tmp/cel-tools/node_modules
        run: |
          git fetch --depth=1 origin 3939737eeba12aa57c534fd37b9d7d9cbecc2504
          python3 - <<'PYGUARD'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','3939737eeba12aa57c534fd37b9d7d9cbecc2504','HEAD'],text=True).splitlines())
          allowed={'web/battle-polish.js','web/battle-polish.css','web/index.html','web/assets/modes-v112/multiplayer.webp','web/assets/modes-v112/survival.webp','web/assets/modes-v112/testing.webp','ci/check-battle-polish.cjs','ci/BATTLE-v115.md','android/app/build.gradle','.github/workflows/android-apk.yml'}
