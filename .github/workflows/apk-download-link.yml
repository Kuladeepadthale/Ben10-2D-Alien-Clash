name: Prepare verified APK download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apk-download-link.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          for asset_id,name in [(661361293,'Ben10-Alien-Clash-Online.apk'),(661361294,'SHA256SUMS.txt')]:
              req=urllib.request.Request('https://api.github.com/repos/Kuladeepadthale/Ben10-2D-Alien-Clash/releases/assets/'+str(asset_id),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream','X-GitHub-Api-Version':'2022-11-28'})
              try: response=opener.open(req)
              except urllib.error.HTTPError as error:
                  if error.code not in (301,302,303,307,308): raise
                  response=error
              location=response.headers.get('Location')
              assert location and location.startswith('https://release-assets.githubusercontent.com/'), name
              print('APK_DOWNLOAD_JSON='+json.dumps({'name':name,'url':location}))
          PY
