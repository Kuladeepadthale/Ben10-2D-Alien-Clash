name: Build 14.6 responsive combat and classic artwork APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/play146.yml','web/free-combat146.js','web/simple-ui146.js','web/simple-ui146.css','ci/check-ui146.cjs','ci/check-free-combat146.cjs','ci/package146.py']
concurrency:
  group: ben10-combat-ui146
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preserve releases and restore previous artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base146 builds/web release-output
          gh release download playstore-14.3 --pattern Ben10-Omniverse-14.3.aab --dir /tmp/base146
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('builds/web')
          with zipfile.ZipFile('/tmp/base146/Ben10-Omniverse-14.3.aab') as z:
           assert z.testzip() is None
           for name in z.namelist():
            if name.startswith('base/assets/') and not name.endswith('/'):
             p=root/name[len('base/assets/'):];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(name))
          p=Path('android/app/build.gradle');s=p.read_text();assert 'versionCode 143' in s;p.write_text(s.replace('versionCode 143','versionCode 146').replace("versionName '14.3'","versionName '14.6'"))
          PY
          python3 ci/package146.py builds/web
          python3 ci/prepare-test-signing.py
      - name: Verify combat and mobile layout
        env:
          NODE_PATH: /tmp/runtime146/node_modules
        run: |
          npm install --prefix /tmp/runtime146 --no-save --no-package-lock playwright @napi-rs/canvas
          /tmp/runtime146/node_modules/.bin/playwright install --with-deps chromium
          node ci/check-free-combat146.cjs
          node ci/check-ui146.cjs
          node ci/size138/check-all-assets.cjs
      - name: Build signed test APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          gradle -p android --no-daemon assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Ben10-Omniverse-14.6.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,os
          with zipfile.ZipFile('release-output/Ben10-Omniverse-14.6.apk') as z:
           assert z.testzip() is None
           for p in Path('builds/web').rglob('*'):
            if p.is_file():assert z.read('assets/'+p.relative_to('builds/web').as_posix())==p.read_bytes(),str(p)
          Path('release-output/source-commit.txt').write_text(os.environ['GITHUB_SHA']+'\n')
          PY
          sha256sum release-output/*.apk > release-output/SHA256SUMS.txt
      - name: Publish new APK without replacing old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "combat-ui-14.6-${GITHUB_SHA:0:7}" release-output/* --prerelease --title 'Ben 10 Omniverse 14.6 - classic art and responsive combat' --notes 'Previous 14.3 artwork retained. Move during ultimates, cancel body attacks with another power, autonomous effects continue. Five-column collection, compact upgrades and first-visit guides. Development-signed APK for device testing; not a Play production AAB. Prior releases untouched.' --target "$GITHUB_SHA"
