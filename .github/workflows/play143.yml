name: Build Play 14.3 rewards and actor repairs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/play143.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore native 14.1 and apply tested visual fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/source143 builds/web release-output
          gh release download playstore-14.1 --pattern Ben10-Omniverse-14.1.apk --dir /tmp/source143
          echo 'e31acb3beebda0f7733011b5e8086bac5fa0d81d8e3ffba455961376826a952b  /tmp/source143/Ben10-Omniverse-14.1.apk' | sha256sum -c -
          python3 - <<'PY'
          import pathlib,zipfile,shutil
          root=pathlib.Path('builds/web')
          with zipfile.ZipFile('/tmp/source143/Ben10-Omniverse-14.1.apk') as z:
           for n in z.namelist():
            if n.startswith('assets/') and not n.endswith('/'):
             p=root/n[7:];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
          for n in ['index.html','power-effects142.js','rewards-actors143.js','rewards-actors143.css']:shutil.copyfile('web/'+n,root/n)
          PY
          python3 -m unittest discover -s ci/size138 -p 'test_*.py'
          python3 ci/size138/prune.py builds/web --report release-output/asset-pruning.json --apply
      - name: Test rewards and the complete interface
        env:
          NODE_PATH: /tmp/test143/node_modules
        run: |
          npm install --prefix /tmp/test143 --no-save --no-package-lock playwright pngjs @napi-rs/canvas
          /tmp/test143/node_modules/.bin/playwright install --with-deps chromium
          node ci/release139/packs.cjs
          node ci/release141/types.cjs
          node ci/release139/review.cjs
          node ci/release142/effects.cjs
          node ci/release142/browser.cjs
          node ci/release143/actors.cjs
          node ci/release143/browser.cjs
          node ci/check-enemy-combat-timing.cjs
          node ci/size138/check-all-assets.cjs
      - name: Compile the release AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          gradle -p android --no-daemon bundleRelease
          cp android/app/build/outputs/bundle/release/app-release.aab release-output/Ben10-Omniverse-14.3-unsigned.aab
          python3 - <<'PY'
          import pathlib,zipfile,json,hashlib
          report=json.loads(pathlib.Path('release-output/asset-pruning.json').read_text())
          for ext,prefix in [('aab','base/assets/')]:
           with zipfile.ZipFile('release-output/Ben10-Omniverse-14.3-unsigned.'+ext) as z:
            actual={n[len(prefix):] for n in z.namelist() if n.startswith(prefix) and not n.endswith('/')}
            assert actual==set(report['retainedSHA256']),('Packaged asset set differs',actual-set(report['retainedSHA256']))
            for name,expected in report['retainedSHA256'].items():
             assert hashlib.sha256(z.read(prefix+name)).hexdigest()==expected,name
          PY
          curl -fLsS https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar validate --bundle=release-output/Ben10-Omniverse-14.3-unsigned.aab
          java -jar /tmp/bundletool.jar dump manifest --bundle=release-output/Ben10-Omniverse-14.3-unsigned.aab > release-output/AndroidManifest.xml
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('release-output/AndroidManifest.xml').read_text()
          assert 'com.google.android.gms.permission.AD_ID' not in s
          assert 'ca-app-pub-8833928525618902~8755259198' in s
          assert 'android:versionCode="143"' in s
          PY
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('release-output');result={}
          for ext in ['aab']:
           f=root/('Ben10-Omniverse-14.3-unsigned.'+ext);result[ext+'Sha256']=hashlib.sha256(f.read_bytes()).hexdigest()
          (root/'signing-request.json').write_text(json.dumps(result))
          PY
      - name: Stage packages for original-key signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view play143-unsigned >/dev/null 2>&1; then
            gh release upload play143-unsigned release-output/* --clobber
          else
            gh release create play143-unsigned release-output/* --prerelease --title '14.3 unsigned staging - do not install' --notes 'Validated staging; awaiting original-key signature.' --target main
          fi

      - name: Prepare ephemeral encrypted key handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/signing143-private ci/signing-handoff
          chmod 700 /tmp/signing143-private
          openssl req -x509 -newkey rsa:3072 -nodes -keyout /tmp/signing143-private/recipient.key -out ci/signing-handoff/recipient.pem -days 1 -subj '/CN=Ephemeral Play 14.3 Signing Transport' 2>/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "signing-handoff-${GITHUB_RUN_ID}"
          git add ci/signing-handoff/recipient.pem
          git commit -m 'Publish ephemeral signing transport certificate [skip ci]'
          git push origin "HEAD:signing-handoff-${GITHUB_RUN_ID}"
          echo "HANDOFF_BRANCH=signing-handoff-${GITHUB_RUN_ID}"
          received=false
          for attempt in $(seq 1 120); do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/ci/signing-handoff/sealed.b64?ref=signing-handoff-${GITHUB_RUN_ID}" --jq .content > /tmp/signing143-private/response 2>/dev/null; then
              base64 -d /tmp/signing143-private/response > /tmp/signing143-private/sealed.b64
              base64 -d /tmp/signing143-private/sealed.b64 > /tmp/signing143-private/sealed.cms
              received=true
              break
            fi
            sleep 5
          done
          test "$received" = true
          openssl cms -decrypt -binary -inform DER -in /tmp/signing143-private/sealed.cms -recip ci/signing-handoff/recipient.pem -inkey /tmp/signing143-private/recipient.key -out /tmp/signing143-private/key.zip
          python3 - <<'PY'
          import zipfile,pathlib
          root=pathlib.Path('/tmp/signing143-private/key');root.mkdir(mode=0o700)
          z=zipfile.ZipFile('/tmp/signing143-private/key.zip')
          for n in ['ben10-upload.jks','store-password.txt','key-password.txt','upload-certificate.pem']:
           (root/n).write_bytes(z.read(n));(root/n).chmod(0o600)
          PY
          keytool -list -keystore /tmp/signing143-private/key/ben10-upload.jks -storepass:file /tmp/signing143-private/key/store-password.txt -alias ben10upload | grep '4A:4D:30:6C:45:D0:97:DB:5F:ED:F8:3B:A8:4A:DA:A0:41:75:E3:9E:27:7B:FE:1A:FF:49:2A:8E:8D:AD:F5:0F'
      - name: Sign and validate the Play AAB with the original key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staged fixed-output
          gh release download play143-unsigned --dir staged
          python3 - <<'PY'
          import json,pathlib,hashlib
          r=json.loads(pathlib.Path('staged/signing-request.json').read_text())
          for ext in ['aab']:
           f=pathlib.Path('staged/Ben10-Omniverse-14.3-unsigned.'+ext)
           assert hashlib.sha256(f.read_bytes()).hexdigest()==r[ext+'Sha256']
          PY
          sdkmanager 'build-tools;36.0.0'
          jarsigner -keystore /tmp/signing143-private/key/ben10-upload.jks -storepass:file /tmp/signing143-private/key/store-password.txt -keypass:file /tmp/signing143-private/key/key-password.txt -sigalg SHA256withRSA -digestalg SHA-256 -signedjar fixed-output/Ben10-Omniverse-14.3.aab staged/Ben10-Omniverse-14.3-unsigned.aab ben10upload
          jarsigner -verify -verbose -certs fixed-output/Ben10-Omniverse-14.3.aab > fixed-output/aab-signature.txt
          grep 'jar verified.' fixed-output/aab-signature.txt
          curl -fLsS https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o /tmp/bundletool.jar
          java -jar /tmp/bundletool.jar validate --bundle=fixed-output/Ben10-Omniverse-14.3.aab
          keytool -printcert -jarfile fixed-output/Ben10-Omniverse-14.3.aab > fixed-output/aab-certificate.txt
          grep '4A:4D:30:6C:45:D0:97:DB:5F:ED:F8:3B:A8:4A:DA:A0:41:75:E3:9E:27:7B:FE:1A:FF:49:2A:8E:8D:AD:F5:0F' fixed-output/aab-certificate.txt
          python3 - <<'PY'
          import zipfile,hashlib,json,pathlib
          out=pathlib.Path('fixed-output');result={}
          for ext in ['aab']:
           f=out/('Ben10-Omniverse-14.3.'+ext)
           with zipfile.ZipFile(f) as z,zipfile.ZipFile('staged/Ben10-Omniverse-14.3-unsigned.'+ext) as original:
            for n in original.namelist():
             if not n.startswith('META-INF/'):assert original.read(n)==z.read(n),n
            if ext=='aab':
             sf=z.read('META-INF/BEN10UPL.SF');assert sf.count(b'Name: ')>100
           result[ext]={'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()}
          (out/'release-validation.json').write_text(json.dumps({'versionCode':143,'package':'com.ben10.myapp','signing':'standard jarsigner/apksigner','unchangedGamePayload':True,'previousAPKBytes':402268929,'retainedArtworkByteIdentical':True,'files':result},indent=2));print(json.dumps(result))
          PY
          cp staged/rewards-tests.json staged/AndroidManifest.xml fixed-output/
          cp release-output/types-tests.json release-output/compact-ui-tests.json release-output/all-assets-tests.json release-output/asset-pruning.json fixed-output/
          gh release create playstore-14.3 fixed-output/* --prerelease --title 'Ben 10 Omniverse 14.3 - power effects, rewards and actor repairs' --notes 'Adds material-specific power effects for aliens and villains. Reward type badges no longer cover artwork; claimable rewards sort first. Repairs stacked character cells, sheet size mismatches and lingering clone bodies during jumps and knockouts. Existing walks, ads, progression and economy retained. Full rendering, reward, combat timing, type and upgrade checks passed.' --target main
      - name: Prepare temporary download for the requested signed file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view playstore-14.3 --json assets > /tmp/aab143-assets.json
          python3 - <<'PYDOWNLOAD'
          import json,urllib.request,urllib.error,os
          data=json.load(open('/tmp/aab143-assets.json'))
          asset=next(a for a in data['assets'] if a['name']=='Ben10-Omniverse-14.3.aab')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/assets/'+str(asset['id'])+'?download='+os.environ['GITHUB_RUN_ID'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream','User-Agent':'signed-aab-download'})
          try:
           urllib.request.build_opener(NoRedirect).open(req)
          except urllib.error.HTTPError as e:
           if e.code==302:print('AAB_DOWNLOAD_URL='+e.headers['Location'])
           else:raise
          PYDOWNLOAD
      - name: Remove ephemeral signing material
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,shutil
          p=pathlib.Path('/tmp/signing143-private')
          if p.is_dir():shutil.rmtree(p)
          PY

# Final visual pass: landscape account controls sit beside XP, branding stays visible.

# Final icon layout: type top-right, lock below, names unobstructed.
